<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <div class="hamburger" onclick="toggleMenu()">&#9776;</div>
        <div class="header-name">
            <h1>Sneakers</h1>
        </div>
        <div class="nav-links">
            <nav>
                <ul>
                    <li><a href="#">Collection</a></li>
                    <li><a href="#">Men</a></li>
                    <li><a href="#">Women</a></li>
                    <li><a href="#">About</a></li>
                    <li><a href="#">Contact</a></li>
                </ul>
            </nav>
        </div>
        <div class="cart">
            <a href="#"><img src="images/icon-cart.svg" alt="Cart Icon"></a>
        </div>
        <div class="avatar">
            <a href="#"><img src="images/image-avatar.png" alt="Avatar" width="50px"></a>
        </div>
    </header>
       <main class="main-content">
        <div class="product-image">
            <img src="images/image-product-1.jpg" alt="Sneaker Image" id="main-image" class="main-image">
            <div class="thumbnails">
                <img src="images/image-product-1-thumbnail.jpg" alt="Thumbnail 1" class="thumbnail" onclick="changeImage('images/image-product-1.jpg')">
                <img src="images/image-product-2-thumbnail.jpg" alt="Thumbnail 2" class="thumbnail" onclick="changeImage('images/image-product-2.jpg')">
                <img src="images/image-product-3-thumbnail.jpg" alt="Thumbnail 3" class="thumbnail" onclick="changeImage('images/image-product-3.jpg')">
                <img src="images/image-product-4-thumbnail.jpg" alt="Thumbnail 4" class="thumbnail" onclick="changeImage('images/image-product-4.jpg')">
            </div>
        </div>
        <div class="snacker-text">
            <h5>SNACKER COMPANY</h5>
            <h3>Fall Limited Edition Sneakers</h3>
            <p>These low-profile sneakers are your perfect casual wear companion. Featuring a durable rubber outer sole, they’ll withstand everything the weather can offer.</p>
             <div class="price">
             <div class="amount">
             <span>$125.00</span>
             <span class="discount-percentage">50%</span>
             </div>
              <span class="discount">$250.00</span>
              </div>
              <div class="buttons">
              <div class="quantity">
                   <button class="minus">-</button>
                   <input type="number" value="0" min="0" max="10">
                   <button class="plus">+</button>
              </div>
                  <button class="add-to-cart"> <a href="#"><img src="images/icon-cart.svg" alt="Cart Icon">Add to Cart</a></button>
              </div>
         </div>
    </main>
     <script>
        function changeImage(imageSrc) {
            document.getElementById('main-image').src = imageSrc;
        }
    </script>
</body>
</html>
